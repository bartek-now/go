syntax = "proto3";

message BoardState {
  message Row {
    repeated uint32 col = 1; 
  }
  repeated Row row = 2;
}

message GameState {
  string id = 1;
  uint32 size = 2;

  enum Result {
    ONGING = 0;
    BLACK_WON = 1;
    WHITE_WON = 2;
    DRAW = 3;
  }
  Result result = 3;

  repeated BoardState board_state = 4;
  bool black_is_next = 5;
}
